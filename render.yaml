services:
  - type: web
    name: barry-gym-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --preload
    disk:
      name: gymdata
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GYM_NAME
        value: Barry's Gym
      - key: GYM_PHONE
        value: "60122201096"
      - key: GYM_HOURS_WEEKDAY
        value: "6:00am - 10:00pm"
      - key: GYM_HOURS_WEEKEND
        value: "7:00am - 8:00pm"
      - key: GYM_PRICE_REGULAR
        value: RM 100/month
      - key: GYM_PRICE_STUDENT
        value: RM 60/month
      - key: BANK_NAME
        value: Public Bank
      - key: BANK_ACCOUNT
        value: "6474752824"
      - key: BANK_HOLDER
        value: Barry Gym
      - key: QR_CODE_IMAGE_URL
        value: ""
      - key: BASE_URL
        value: https://barry-gym-bot.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/gym.db
      - key: TZ
        value: Asia/Kuala_Lumpur
      - key: ULTRAMSG_INSTANCE
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
