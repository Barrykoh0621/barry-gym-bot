{% extends "base.html" %}
{% block title %}{{ action }} Member — {{ gym_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <h4>
    <i class="bi bi-person-plus me-2" style="color:var(--accent)"></i>
    {{ action }} Member
  </h4>
  <small class="text-muted">
    <a href="{{ url_for('members') }}" class="text-muted text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i>Back to Members
    </a>
  </small>
</div>

<div class="card" style="max-width:600px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">

        <div class="col-12">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control"
                 value="{{ member.name if member else '' }}"
                 placeholder="e.g. Ahmad Fariz" required />
        </div>

        <div class="col-12">
          <label class="form-label">Phone Number <span class="text-danger">*</span></label>
          <input type="text" name="phone" class="form-control"
                 value="{{ member.phone if member else '' }}"
                 placeholder="e.g. 60123456789" required />
          <div class="form-text" style="color:#6b7280; font-size:.75rem;">
            Include country code, no spaces/dashes (e.g. 60123456789)
          </div>
        </div>

        <div class="col-12">
          <label class="form-label">Membership Plan <span class="text-danger">*</span></label>
          <div class="d-flex gap-3 mt-1">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="membership_type"
                     id="regular" value="regular"
                     {% if not member or member.membership_type == 'regular' %}checked{% endif %} />
              <label class="form-check-label" for="regular">
                Regular <span style="color:#6b7280;font-size:.8rem;">— RM 100/mo</span>
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="membership_type"
                     id="student" value="student"
                     {% if member and member.membership_type == 'student' %}checked{% endif %} />
              <label class="form-check-label" for="student">
                Student <span style="color:#6b7280;font-size:.8rem;">— RM 60/mo</span>
              </label>
            </div>
          </div>
        </div>

        <div class="col-6">
          <label class="form-label">Start Date <span class="text-danger">*</span></label>
          <input type="date" name="start_date" class="form-control"
                 value="{{ member.start_date if member else today }}" required />
        </div>

        <div class="col-6">
          <label class="form-label">Expiry Date <span class="text-danger">*</span></label>
          <input type="date" name="expiry_date" class="form-control"
                 value="{{ member.expiry_date if member else '' }}" required />
        </div>

        <div class="col-12">
          <label class="form-label">Payment Status <span class="text-danger">*</span></label>
          <select name="payment_status" class="form-select">
            <option value="paid"    {% if member and member.payment_status == 'paid'    %}selected{% endif %}>Paid</option>
            <option value="pending" {% if not member or member.payment_status == 'pending' %}selected{% endif %}>Pending</option>
            <option value="overdue" {% if member and member.payment_status == 'overdue' %}selected{% endif %}>Overdue</option>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label">Notes <span class="text-muted" style="font-size:.75rem;">(optional)</span></label>
          <textarea name="notes" class="form-control" rows="2"
                    placeholder="Any notes about this member…">{{ member.notes if member else '' }}</textarea>
        </div>

        <div class="col-12 d-flex gap-2 pt-1">
          <button type="submit" class="btn btn-accent">
            <i class="bi bi-check-lg me-1"></i>{{ action }} Member
          </button>
          <a href="{{ url_for('members') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>

      </div>
    </form>
  </div>
</div>

<script>
  // Auto-set expiry 30 days after start date if empty
  const startInput  = document.querySelector('[name="start_date"]');
  const expiryInput = document.querySelector('[name="expiry_date"]');
  startInput.addEventListener('change', () => {
    if (!expiryInput.value) {
      const d = new Date(startInput.value);
      d.setMonth(d.getMonth() + 1);
      expiryInput.value = d.toISOString().split('T')[0];
    }
  });
</script>
{% endblock %}
